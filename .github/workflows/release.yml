name: HY2 release checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bash source syntax
        run: |
          set -Eeuo pipefail
          for file in hy2.sh nat.sh vpswg.sh natjichang.sh scripts/hy2_fresh_preflight.sh; do bash -n "$file"; done
      - name: Static SOCKS5 upstream integrity (no functional tests)
        run: python3 scripts/check_socks5_bundle.py
      - name: HY2 unit and generated Bash syntax tests
        run: python3 tests/run_hy2_checks.py
